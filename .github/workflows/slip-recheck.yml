# ตรวจสลิปซ้ำกับธนาคาร — เรียก /api/cron/slip-recheck ทุก 10 นาที (GitHub อาจเลื่อนเวลาได้บ้าง)
# สลิปธนาคารกรุงเทพที่โอนไม่ถึง 5 นาที EasySlip ตอบ SLIP_PENDING — รอบนี้ตรวจให้ใหม่จนได้คำตอบ (สูงสุด 12 ครั้ง)
# ไม่มีสลิปรอ = แอปตอบ skipped ทันที ไม่เรียก EasySlip และไม่บันทึก JobRun
# - 200 = สำเร็จ / สถานะอื่นหรือเข้าเว็บไม่ได้ = ล้มเหลว → แจ้ง Telegram จากที่นี่ (ไม่พึ่งแอป)
# ต้องตั้ง: vars.APP_URL, secrets.CRON_SECRET (+ secrets.TELEGRAM_BOT_TOKEN, secrets.TELEGRAM_ADMIN_CHAT_ID) — ชุดเดียวกับ watchdog.yml
name: Slip recheck

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slip-recheck
  cancel-in-progress: false

jobs:
  slip-recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call slip-recheck endpoint
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::ยังไม่ได้ตั้ง vars.APP_URL หรือ secrets.CRON_SECRET"
            exit 1
          fi
          case "$APP_URL" in
            https://*) ;;
            *) echo "::error::APP_URL ต้องเป็น https:// (ห้ามส่ง CRON_SECRET แบบไม่เข้ารหัส)"; exit 1 ;;
          esac
          status=$(curl -sS --proto '=https' -o response.json -w '%{http_code}' --max-time 90 \
            -H "Authorization: Bearer ${CRON_SECRET}" "${APP_URL}/api/cron/slip-recheck") || true
          echo "HTTP ${status}"
          cat response.json 2>/dev/null || true
          echo
          if [ "$status" != "200" ]; then
            echo "::error::slip-recheck ตอบ HTTP ${status}"
            exit 1
          fi

      - name: Alert admins (independent of the app)
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_ADMIN_CHAT_ID" ]; then
            echo "::warning::ไม่ได้ตั้ง Telegram secrets — ใช้อีเมลแจ้งเตือนของ GitHub แทน"
            exit 0
          fi
          curl -sS --max-time 20 -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_ADMIN_CHAT_ID}" \
            --data-urlencode "disable_web_page_preview=true" \
            --data-urlencode "text=🚨 งานตรวจสลิปซ้ำ (slip-recheck) ไม่สำเร็จ — ${RUN_URL}"
